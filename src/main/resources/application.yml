server:
  port: 8086

spring:
  application:
    name: myRag
  ai:
    openai:
      api-key: ${QW_API_KEY}

      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: text-embedding-v4
        dimensions: 1024

      chat:
        model: qwen-plus
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: java_knowledge
        use-tls: false
        initialize-schema: false

  datasource:
    url:  jdbc:postgresql://127.0.0.1:5432/myrag
    username: ${POSTGRES_USERNAME:myrag_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1